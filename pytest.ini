[pytest]
testpaths = tests
addopts = -ra --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=75
markers =
    unit: fast tests with no I/O (domain rules and use cases with in-memory fakes)
    integration: tests that go through HTTP and a real SQL database
    e2e: tests against a running stack (make e2e)
filterwarnings =
    error::DeprecationWarning:app.*
